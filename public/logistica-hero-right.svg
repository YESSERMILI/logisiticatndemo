<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d">
  <title id="t">Logistica Tunisie - de la commande à la livraison</title>
  <desc id="d">Des colis traversent trois portiques le long d'une route orange jusqu'au point de livraison.</desc>

  <defs>
    <!-- Logo arch: 200 x 240 unit shape, 35 thick legs -->
    <path id="arch" d="M0,240 V100 A100,100 0 0 1 200,100 V240 H165 V100 A65,65 0 0 0 35,100 V240 Z"/>
    <path id="route" d="M24,340 C80,180 190,92 320,92 S560,180 616,340"/>
    <g id="parcel">
      <rect width="48" height="42" fill="#1F6FDB"/>
      <rect y="15" width="48" height="10" fill="#F7941D"/>
    </g>
  </defs>

  <style>
    .cloud   { animation: drift 40s linear infinite; }
    .halo    { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    .parcel  { animation: run 8s linear infinite; }
    .bob     { animation: bob .55s ease-in-out infinite alternate; }
    .beacon  { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-in-out infinite; }
    .pin     { animation: float 3s ease-in-out infinite; }
    .badge   { transform-box: fill-box; transform-origin: center; animation: pop 5.5s cubic-bezier(.22,1,.36,1) infinite; }
    .dot     { animation: twinkle 4s ease-in-out infinite; }
    @keyframes drift   { from { transform: translateX(-160px) } to { transform: translateX(700px) } }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
    @keyframes run     { from { transform: translateX(-80px) } to { transform: translateX(700px) } }
    @keyframes bob     { from { transform: translateY(0) } to { transform: translateY(-3px) } }
    @keyframes ping    { 0%,60%,100% { opacity:.25; transform: scale(1) } 12%,28% { opacity:1; transform: scale(1.7) } }
    @keyframes float   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @keyframes pop     { 0%,55% { opacity:0; transform: scale(.2) } 65% { opacity:1; transform: scale(1.15) } 72%,92% { opacity:1; transform: scale(1) } 100% { opacity:0; transform: scale(1) } }
    @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.55 } }
    @media (prefers-reduced-motion: reduce) {
      .cloud,.halo,.parcel,.bob,.beacon,.pin,.badge,.dot { animation: none }
      .parcel { transform: translateX(300px) }
      .badge { opacity: 1 }
      .beacon { opacity: 1 }
    }
  </style>

  <!-- Soft halo (transparent background: sits on any hero color) -->
  <circle class="halo" cx="320" cy="260" r="225" fill="#DCE9FF"/>

  <!-- Clouds (outer g = position, inner g = animation) -->
  <g transform="translate(0,40)" fill="#FFFFFF">
    <g class="cloud" style="animation-delay:-6s">
      <rect x="0" y="14" width="96" height="24" rx="12"/><circle cx="34" cy="16" r="15"/><circle cx="62" cy="12" r="18"/>
    </g>
  </g>
  <g transform="translate(0,120)" fill="#FFFFFF" opacity=".85">
    <g class="cloud" style="animation-delay:-26s">
      <rect x="0" y="14" width="76" height="20" rx="10"/><circle cx="26" cy="15" r="12"/><circle cx="50" cy="11" r="15"/>
    </g>
  </g>

  <!-- Twinkling dots -->
  <g fill="#1F6FDB">
    <circle class="dot" cx="70" cy="190" r="4"/>
    <circle class="dot" style="animation-delay:-1.3s" cx="580" cy="130" r="3"/>
    <circle class="dot" style="animation-delay:-2.6s" cx="600" cy="300" r="4"/>
    <circle class="dot" style="animation-delay:-.7s" cx="40" cy="260" r="3"/>
  </g>

  <!-- Flow Line -->
  <use href="#route" fill="none" stroke="#0C2A6B" stroke-opacity=".3" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 13"/>
  <circle r="8" fill="#F7941D">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>

  <!-- Gateways -->
  <use href="#arch" fill="#0C2A6B" opacity=".5" transform="translate(40,288) scale(.6)"/>
  <use href="#arch" fill="#0C2A6B" opacity=".5" transform="translate(480,288) scale(.6)"/>
  <use href="#arch" fill="#0C2A6B"              transform="translate(190,120) scale(1.3)"/>

  <!-- Checkpoint beacons -->
  <circle class="beacon" cx="100" cy="325" r="5" fill="#F7941D" style="animation-delay:0s"/>
  <circle class="beacon" cx="320" cy="190" r="8" fill="#F7941D" style="animation-delay:.5s"/>
  <circle class="beacon" cx="540" cy="325" r="5" fill="#F7941D" style="animation-delay:1s"/>

  <!-- Destination pin -->
  <g class="pin"><g transform="translate(320,58)">
    <path d="M0,26 C-14,10 -18,4 -18,-6 A18,18 0 0 1 18,-6 C18,4 14,10 0,26 Z" fill="#F7941D"/>
    <circle cy="-6" r="7" fill="#FFFFFF"/>
  </g></g>

  <!-- Orange base line (from the logo) -->
  <line x1="12" y1="440" x2="628" y2="440" stroke="#F7941D" stroke-width="16" stroke-linecap="round"/>

  <!-- Parcels -->
  <g class="parcel" style="animation-delay:0s"><g class="bob"><use href="#parcel" transform="translate(0,390)"/></g></g>
  <g class="parcel" style="animation-delay:-2.7s"><g class="bob" style="animation-delay:-.2s"><use href="#parcel" transform="translate(0,390)"/></g></g>
  <g class="parcel" style="animation-delay:-5.4s"><g class="bob" style="animation-delay:-.4s"><use href="#parcel" transform="translate(0,390)"/></g></g>

  <!-- Delivered badge -->
  <g class="badge"><g transform="translate(560,240)">
    <circle r="22" fill="#1F6FDB"/>
    <path d="M-9,1 L-3,7 L10,-7" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</svg>